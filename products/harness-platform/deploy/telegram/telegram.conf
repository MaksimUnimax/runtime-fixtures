ServerRoot "/etc/octoport-telegram-router"
ServerName octoport-telegram-router
Listen ${TELEGRAM_LISTEN}
DefaultRuntimeDir "/run/octoport-telegram-router"
PidFile "/run/octoport-telegram-router/httpd.pid"
ErrorLog /run/octoport-telegram-router/error.log
LogLevel crit
ServerTokens Prod
ServerSignature Off
Timeout 25
ProxyTimeout 25

Include /etc/apache2/mods-available/mpm_event.load
Include /etc/apache2/mods-available/authz_core.load
Include /etc/apache2/mods-available/authz_host.load
Include /etc/apache2/mods-available/proxy.load
Include /etc/apache2/mods-available/proxy_connect.load
User www-data
Group www-data
StartServers 1
ServerLimit 4
ThreadsPerChild 8
MaxRequestWorkers 32
MinSpareThreads 4
MaxSpareThreads 16

DocumentRoot "/etc/octoport-telegram-router/empty"
<Directory "/">
    Require all denied
</Directory>
ProxyRequests On
AllowCONNECT 443
<Proxy "*">
    <RequireAll>
        Require ip ${TELEGRAM_APP_SOURCES}
        Require expr "%{REQUEST_METHOD} == 'CONNECT' && %{THE_REQUEST} =~ m#^CONNECT (api|oauth)[.]telegram[.]org:443 HTTP/1[.][01]$#"
    </RequireAll>
</Proxy>
