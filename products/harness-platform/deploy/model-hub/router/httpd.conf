ServerRoot "/etc/octoport-provider-router"
ServerName octoport-provider-router
Listen ${OCTOPORT_ROUTER_LISTEN}
PidFile "/run/octoport-provider-router/httpd.pid"
DefaultRuntimeDir "/run/octoport-provider-router"
Mutex default:/run/octoport-provider-router
ErrorLog /run/octoport-provider-router/error.log
LogLevel warn authz_core:crit
ServerTokens Prod
Timeout 120
ProxyTimeout 120

LoadModule mpm_event_module /usr/lib/apache2/modules/mod_mpm_event.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule authz_host_module /usr/lib/apache2/modules/mod_authz_host.so
LoadModule proxy_module /usr/lib/apache2/modules/mod_proxy.so
LoadModule proxy_connect_module /usr/lib/apache2/modules/mod_proxy_connect.so

User www-data
Group www-data
StartServers 1
ServerLimit 4
ThreadLimit 32
ThreadsPerChild 16
MinSpareThreads 16
MaxSpareThreads 64
MaxRequestWorkers 64

DocumentRoot "/etc/octoport-provider-router/empty"
<Directory "/">
    Require all denied
</Directory>

ProxyRequests On
AllowCONNECT 443
<Proxy "*">
    Require all denied
</Proxy>
Include "/etc/octoport-provider-router/providers.conf"
