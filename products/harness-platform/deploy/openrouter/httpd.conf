ServerRoot "/etc/octoport-openrouter"
ServerName octoport-openrouter
Listen ${OPENROUTER_PROXY_LISTEN}
DefaultRuntimeDir "/run/octoport-openrouter"
PidFile "/run/octoport-openrouter/httpd.pid"
ErrorLog /var/log/octoport-openrouter/error.log
LogLevel warn
ServerTokens Prod
Timeout 300
ProxyTimeout 300

LoadModule mpm_event_module /usr/lib/apache2/modules/mod_mpm_event.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule authz_host_module /usr/lib/apache2/modules/mod_authz_host.so
LoadModule proxy_module /usr/lib/apache2/modules/mod_proxy.so
LoadModule proxy_connect_module /usr/lib/apache2/modules/mod_proxy_connect.so

User www-data
Group www-data
DocumentRoot "/etc/octoport-openrouter/empty"
<Directory "/">
    Require all denied
</Directory>
ProxyRequests On
AllowCONNECT 443
<Proxy "*">
    Require all denied
</Proxy>
<ProxyMatch "^(?i:openrouter\.ai):443$">
    <RequireAll>
        Require method CONNECT
        Require ip ${OPENROUTER_ALLOWED_CLIENTS}
    </RequireAll>
</ProxyMatch>
CustomLog /var/log/octoport-openrouter/access.log "%t %a %m %>s %D"
