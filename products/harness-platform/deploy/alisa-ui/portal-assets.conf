location = /octoport-ui/portal.css {
    alias /var/www/octoport-ui/portal.css;
    default_type text/css;
    expires -1;
}
location = /octoport-ui/favicon.png {
    alias /var/www/octoport-ui/favicon.png;
    default_type image/png;
    expires -1;
}

location = /octoport-ui/octoport-wordmark.svg {
    alias /var/www/octoport-ui/octoport-wordmark.svg;
    default_type image/svg+xml;
    expires -1;
}
