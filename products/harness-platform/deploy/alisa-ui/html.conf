# Include inside the existing HTML proxy location, alongside its existing proxy headers.
proxy_set_header Accept-Encoding "";
sub_filter '</head>' '<link rel="stylesheet" href="/octoport-ui/theme.css"><link rel="icon" type="image/png" href="/octoport-ui/favicon.png"></head>';
# Station templates omit the optional closing head tag.
sub_filter '<link rel="stylesheet" href="style.css"><main>' '<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="/octoport-ui/theme.css"><link rel="icon" type="image/png" href="/octoport-ui/favicon.png"><main>';
