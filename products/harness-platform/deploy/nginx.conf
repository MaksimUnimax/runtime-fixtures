server {
    listen 80;
    listen [::]:80;
    server_name harness.185-219-43-9.sslip.io;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/harness-public-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://harness.185-219-43-9.sslip.io$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name harness.185-219-43-9.sslip.io octoport.ru;
    ssl_certificate /etc/letsencrypt/live/harness-origin-185-219-43-9/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/harness-origin-185-219-43-9/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    if ($host !~ ^(harness\.185-219-43-9\.sslip\.io|octoport\.ru)$) { return 421; }
    client_max_body_size 128k;
    location / {
        proxy_pass http://127.0.0.1:18763;
        # Let the public edge honor streaming routes from the application.
        proxy_pass_header X-Accel-Buffering;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 160s;
    }
}
