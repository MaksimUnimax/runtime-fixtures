<div class="guest-chat" data-guest-chat>
  <div class="guest-heading"><img src="/about/assets/octoport-brand.png" width="36" height="36" alt=""><h1>Спросите Октопуса</h1></div>
  <p class="guest-hint">Задайте вопрос о работе Октопорта, подключении магазина или монетах.</p>
  <button type="button" class="guest-older" hidden>Показать предыдущие сообщения</button>
  <div class="guest-history ym-hide-content" role="log" aria-label="Переписка с Октопусом" aria-live="polite"></div>
  <form class="guest-composer"><label class="visually-hidden" for="octopus-question">Ваш вопрос Октопусу</label><textarea data-composer-input id="octopus-question" class="ym-disable-keys" rows="2" maxlength="8192" placeholder="Напишите вопрос Октопусу" required></textarea><button type="submit" aria-label="Отправить вопрос">Отправить</button></form>
  <p role="status" class="guest-status"></p>
</div>
