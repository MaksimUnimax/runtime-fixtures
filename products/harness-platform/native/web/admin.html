<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/ui-assets/project/octoport-icon.png" type="image/png"><title>Администрирование · octoport</title><link rel="stylesheet" href="/ui-assets/project/appearance.css"><link rel="stylesheet" href="/ui-assets/project/admin.css">
<script src="/session-nav.js"></script><script type="module" src="/ui-assets/project/admin.js"></script></head>
<body class="octo-admin"><main><nav><a href="/"><img class="admin-mark" src="/ui-assets/project/octoport-mark.png" width="24" height="24" alt=""> <img class="octo-wordmark" src="/ui-assets/project/octoport-wordmark.svg" width="104" height="28" alt="octoport"><span>В чат</span></a> <a href="/admin/model-hub">Хаб моделей</a></nav><h1>Администрирование</h1>
<section aria-labelledby="model-heading"><h2 id="model-heading">Модель по умолчанию</h2>
<p id="current-model" role="status"></p>
<p>Выбор действует со следующего сообщения во всех чатах с прямым подключением DeepSeek.</p>
<button id="refresh-models" type="button">Запросить модели</button>
<form id="default-model" hidden><label>Модель<select name="model" required></select></label>
<label>Рассуждение<select name="effort" required></select></label>
<button type="submit">Установить по умолчанию</button></form>
<p id="model-status" role="status" aria-live="polite"></p></section>
<section><h2>Ключи моделей</h2>
<form id="deepseek" autocomplete="off"><label>Ключ прямого подключения DeepSeek<input type="password" name="key" autocomplete="new-password" required></label><button>Сохранить ключ</button><output></output></form>
<form id="openrouter" autocomplete="off"><label>Новый ключ OpenRouter<input type="password" name="key" autocomplete="new-password" required></label><button>Сохранить OpenRouter</button><output></output></form></section>
<section><h2>Цена покупки монеты</h2>
<form id="pricing"><label>Наценка при покупке, %<input required name="markupPercent" type="number" min="0" max="1000" step="0.01"></label>
<p id="sale-price" aria-live="polite"></p><button>Сохранить цену</button><output></output></form></section>
<section><h2>Начислить монеты</h2>
<form id="grant"><label>Логин получателя<input name="login" required></label>
<label>Монеты<input name="amount" inputmode="decimal" required></label>
<label>Основание<input name="reason" required></label><button>Начислить монеты</button><output></output></form></section>
<section><h2>Расходы аккаунта</h2>
<form id="inspect"><label>Логин для просмотра расходов<input name="login" required></label><button>Показать расходы</button></form>
<p id="account" role="status"></p><div id="meters"></div><ul id="charges"></ul></section><p role="alert" id="problem"></p>
</main></body></html>
