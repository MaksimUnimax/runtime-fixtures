# Octoport SITE-S1 static public-site ingress.
# Replaces only the apex pre-deployment 503 after the static release is staged.
# Portal/API remain explicitly unavailable until their own deployment boundaries.

server {
    listen 80;
    server_name octoport.ru www.octoport.ru app.octoport.ru api.octoport.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/octoport-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.octoport.ru;

    ssl_certificate /etc/letsencrypt/live/octoport.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/octoport.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 308 https://octoport.ru$request_uri;
}

server {
    listen 443 ssl;
    server_name octoport.ru;

    ssl_certificate /etc/letsencrypt/live/octoport.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/octoport.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/octoport-site/current;
    index index.html;
    autoindex off;
    etag on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;

    # Use `expires` instead of location-level `add_header Cache-Control` so the
    # security headers above continue to be inherited by every static response.
    location = / {
        try_files /index.html =503;
        expires -1;
    }

    location = /index.html {
        try_files /index.html =503;
        expires -1;
    }

    location = /privacy {
        try_files /privacy.html =404;
        default_type text/html;
        expires -1;
    }

    location = /support {
        try_files /support.html =404;
        default_type text/html;
        expires -1;
    }

    location = /install {
        try_files /install.html =404;
        default_type text/html;
        expires -1;
    }

    location = /styles.css {
        try_files /styles.css =404;
        default_type text/css;
        expires 5m;
    }

    location = /robots.txt {
        try_files /robots.txt =404;
        default_type text/plain;
        expires 5m;
    }

    location = /sitemap.xml {
        try_files /sitemap.xml =404;
        default_type application/xml;
        expires 5m;
    }

    location / {
        try_files $uri =404;
    }
}

server {
    listen 443 ssl;
    server_name app.octoport.ru;

    ssl_certificate /etc/letsencrypt/live/octoport.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/octoport.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Retry-After "3600" always;

    default_type text/plain;
    return 503 "Octoport portal is not deployed yet.\n";
}

server {
    listen 443 ssl;
    server_name api.octoport.ru;

    ssl_certificate /etc/letsencrypt/live/octoport.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/octoport.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Retry-After "3600" always;

    default_type application/json;
    return 503 '{"error":"service_not_deployed"}\n';
}
