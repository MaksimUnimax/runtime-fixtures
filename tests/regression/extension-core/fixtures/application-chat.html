<!doctype html><html><head><meta charset="utf-8"><style>body{font:16px system-ui;margin:40px auto;max-width:760px}section{padding:14px;margin:14px 0;background:#f4f6f9}pre{white-space:pre-wrap}form{padding:16px;border:1px solid #ccc}#prompt-textarea{min-height:70px;white-space:pre-wrap}button{padding:10px}</style></head><body>
<main id="turns"><section data-turn="assistant" data-turn-id="old-history"><div class="code"><button aria-label="Copy">Copy code</button><pre><code>WB_API_V1 {"operation":"seller_info","params":{}}</code></pre></div></section></main>
<form><div id="prompt-textarea" contenteditable="true" role="textbox"></div><button type="button" data-testid="send-button" aria-label="Send prompt">Send</button><button type="button" data-testid="voice-mode-button" aria-label="Use voice mode" hidden>Voice</button><input type="file" multiple hidden><div id="attachments"></div></form>
<script>
window.sent=[];window.files=[];let seq=0;
window.fixtureCommand=(text,id='command-'+(++seq))=>{const s=document.createElement('section');s.dataset.turn='assistant';s.dataset.turnId=id;const d=document.createElement('div');d.className='code';const b=document.createElement('button');b.setAttribute('aria-label','Copy');b.textContent='Copy code';const pre=document.createElement('pre');const c=document.createElement('code');c.textContent=text;pre.append(c);d.append(b,pre);s.append(d);document.querySelector('#turns').append(s);return id;};
window.fixtureCurrentChatGPTBlock=(text,role='assistant',id='current-'+role+'-'+(++seq))=>{const li=document.createElement('li');li.dataset.messageRole=role;li.id=id;if(role==='assistant')li.setAttribute('data-message-complete','');const markdown=document.createElement('div');markdown.dataset.assistantMarkdown='';const pre=document.createElement('pre');pre.dataset.assistantStreamBlock='';pre.dataset.assistantStreamBlockIndex='0';const code=document.createElement('code');code.className='language-text';code.textContent=text;const controls=document.createElement('span');controls.dataset.messageContentControls='';const copy=document.createElement('button');copy.type='button';copy.dataset.codeCopyState='idle';copy.setAttribute('aria-label','Copy code');controls.append(copy);pre.append(code,controls);markdown.append(pre);li.append(markdown);document.querySelector('#turns').append(li);return id;};
const composer=document.querySelector('#prompt-textarea'),send=document.querySelector('[data-testid="send-button"]'),voice=document.querySelector('[data-testid="voice-mode-button"]');
composer.addEventListener('input',()=>{send.hidden=!composer.textContent.trim();voice.hidden=!send.hidden;});
send.onclick=()=>{const text=composer.innerText;window.sent.push(text);const u=document.createElement('section');u.dataset.turn='user';u.dataset.turnId='user-'+(++seq);u.textContent=text;document.querySelector('#turns').append(u);composer.textContent='';send.hidden=true;voice.hidden=false;setTimeout(()=>{const a=document.createElement('section');a.dataset.turn='assistant';a.dataset.turnId='reply-'+(++seq);a.textContent='Инструкция или результат получены';document.querySelector('#turns').append(a);},150);};
document.querySelector('input[type="file"]').addEventListener('change', async e=>{for(const f of e.target.files){window.files.push({name:f.name,bytes:[...new Uint8Array(await f.arrayBuffer())]});const a=document.createElement('div');a.textContent=f.name;a.setAttribute('role','group');a.setAttribute('aria-label',f.name);document.querySelector('#attachments').append(a);}});
</script></body></html>
