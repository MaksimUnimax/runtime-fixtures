openapi: 3.1.0
info:
  title: ALISA Service Platform — proposed API
  version: '0.5'
  description: Проект доменного API Алисы. В v0.5 вход вынесен в отдельный OIDC authority;
    deprecated локальные challenge routes не реализуются как второй auth. Entry points
    в entrypoints-v0.5.yaml. Не установленный API.
servers:
- url: https://alisa.octoport.ru
  description: Предлагаемый адрес, не проверенный live endpoint
paths:
  /api/v1/auth/challenges:
    post:
      operationId: createLoginChallenge
      summary: Отправить одноразовый код
      tags:
      - AL-F01
      x-feature-id: AL-F01
      x-surface: public
      x-required-permission: public
      description: Проект новой платформы. Любые tenant/resource IDs перепроверяются
        сервером; схема сама по себе не авторизация.
      security: []
      responses:
        '202':
          description: Успешный предметный результат; фактические эффекты проверяются
            отдельно.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
        '401':
          description: Нет действующей сессии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточные права/MFA/CSRF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Ресурс не найден в допустимом scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Конфликт revision/idempotency/state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Невалидная форма/семантика
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Ограничение частоты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Зависимость недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: &id001
          type: string
          format: uuid
      - name: X-CSRFToken
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginChallengeRequest'
      x-implementation-step: AL-S02
      deprecated: true
      x-authority: SUPERSEDED_BY_OIDC
      x-implementation-disposition: Do not implement duplicate product-local auth.
        Equivalent behavioral tests run through identity provider.
      x-product-id: alisa_market
