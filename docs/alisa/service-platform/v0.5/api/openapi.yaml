components:
  securitySchemes:
    userSession:
      type: apiKey
      in: cookie
      name: __Host-alisa_session
    staffSession:
      type: apiKey
      in: cookie
      name: __Host-alisa_staff
      description: Separate admin origin; authenticated MFA session required
  schemas:
    Id: *id001
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
              minLength: 1
              maxLength: 80
            message:
              type: string
              minLength: 1
              maxLength: 500
            trace_id: *id001
            retryable:
              type: boolean
            retry_after_seconds:
              type: integer
              minimum: 0
              maximum: 86400
          required:
          - code
          - message
          - trace_id
          - retryable
      required:
      - error
    ActionReceipt:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        state:
          type: string
          enum:
          - ACCEPTED
          - APPLIED
          - NO_CHANGE
          - BLOCKED
          - UNKNOWN
        revision:
          type: integer
          minimum: 1
          maximum: 2147483647
        trace_id: *id001
      required:
      - id
      - state
      - revision
      - trace_id
    Challenge:
      type: object
      additionalProperties: false
      properties:
        challenge_id: *id001
        expires_at: &id004
          type: string
          format: date-time
        retry_after_seconds:
          type: integer
          minimum: 0
          maximum: 3600
        trace_id: *id001
      required:
      - challenge_id
      - expires_at
      - retry_after_seconds
      - trace_id
    Session:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        created_at: *id004
        expires_at: *id004
        current:
          type: boolean
        origin_class:
          type: string
          enum:
          - USER
          - STAFF
      required:
      - id
      - created_at
      - expires_at
      - current
      - origin_class
    Account:
      type: object
      additionalProperties: false
      properties:
        user_id: *id001
        tenant_id: *id001
        status:
          type: string
          enum:
          - ACTIVE
          - BLOCKED
          - DELETING
          - DELETED
        email:
          type: string
          format: email
          maxLength: 254
        business_timezone: *id005
        voice_privacy:
          type: string
          enum:
          - NORMAL
          - NO_MONEY_VOICE
        revision:
          type: integer
          minimum: 1
          maximum: 2147483647
      required:
      - user_id
      - tenant_id
      - status
      - email
      - business_timezone
      - voice_privacy
      - revision
    Capability:
      type: object
      additionalProperties: false
      properties:
        operation_id:
          type: string
          minLength: 1
          maxLength: 128
        state:
          type: string
          enum:
          - AVAILABLE
          - UNVERIFIED
          - AUTH_OR_SCOPE
          - PROVIDER_PLAN_REQUIRED
          - UNSUPPORTED
          - TEMPORARILY_UNAVAILABLE
        credential_revision:
          type: integer
          minimum: 1
          maximum: 2147483647
        qualified_at:
          anyOf:
          - *id004
          - type: 'null'
        reason_code:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - operation_id
      - state
      - credential_revision
      - reason_code
    Store:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        provider:
          type: string
          enum:
          - ozon
          - wb
        name:
          type: string
          minLength: 1
          maxLength: 120
        voice_alias:
          type: string
          minLength: 1
          maxLength: 120
        state:
          type: string
          enum:
          - PENDING_CREDENTIALS
          - VERIFYING
          - ACTIVE
          - DISABLED
          - DELETED
        identity_verified:
          type: boolean
        credential_revision:
          type: integer
          minimum: 0
          maximum: 2147483647
        revision:
          type: integer
          minimum: 1
          maximum: 2147483647
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
          minItems: 0
          maxItems: 200
      required:
      - id
      - provider
      - name
      - voice_alias
      - state
      - identity_verified
      - credential_revision
      - revision
      - capabilities
    Grant:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        source:
          type: string
          enum:
          - PAYMENT
          - GIFT
          - COMPENSATION
          - TRIAL
        starts_at: *id004
        ends_at: *id004
        state:
          type: string
          enum:
          - SCHEDULED
          - ACTIVE
          - EXPIRED
          - REVOKED
          - ADJUSTED
        reason_code:
          type: string
          minLength: 1
          maxLength: 128
        revision:
          type: integer
          minimum: 1
          maximum: 2147483647
      required:
      - id
      - source
      - starts_at
      - ends_at
      - state
      - reason_code
      - revision
    Entitlement:
      type: object
      additionalProperties: false
      properties:
        allow_new_job:
          type: boolean
        basis:
          type: string
          enum:
          - PAYMENT
          - GIFT
          - COMPENSATION
          - TRIAL
          - NONE
        blocked:
          type: boolean
        revision:
          type: integer
          minimum: 1
          maximum: 2147483647
        grants:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
          minItems: 0
          maxItems: 100
      required:
      - allow_new_job
      - basis
      - blocked
      - revision
      - grants
    Offer:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        plan_id:
          const: ALISA_STANDARD
        duration_months:
          type: integer
          enum:
          - 1
          - 3
          - 6
          - 12
        price_minor:
          type: integer
          minimum: 0
          maximum: 1000000000
        currency:
          const: RUB
        price_version:
          type: string
          minLength: 1
          maxLength: 64
        feature_set_version:
          type: string
          minLength: 1
          maxLength: 64
        terms_version:
          type: string
          minLength: 1
          maxLength: 64
        valid_until: *id004
        environment:
          type: string
          enum:
          - sandbox
          - production
      required:
      - id
      - plan_id
      - duration_months
      - price_minor
      - currency
      - price_version
      - feature_set_version
      - terms_version
      - valid_until
      - environment
    Order:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        offer_id: *id001
        duration_months:
          type: integer
          enum:
          - 1
          - 3
          - 6
          - 12
        amount_minor:
          type: integer
          minimum: 0
          maximum: 1000000000
        currency:
