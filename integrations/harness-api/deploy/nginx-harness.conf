# Included only in the TLS server for alisa.octoport.ru.
location = /harness { return 303 /harness/; }
location ^~ /harness/ {
    proxy_pass http://127.0.0.1:18131;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_read_timeout 40s;
    proxy_send_timeout 40s;
    client_max_body_size 64k;
    proxy_buffering off;
    access_log off;
}
# The existing login flow intentionally returns only to /app. This marker
# chooses a fixed landing page; authentication is still checked by the gateway.
location = /app {
    if ($http_cookie ~ "(^|; *)__Host-octoport_harness_return=1(;|$)") {
        return 303 /harness/;
    }
    proxy_pass http://127.0.0.1:18100;
    include /etc/nginx/snippets/octoport-visual-html*.conf;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}
location = /app/ {
    if ($http_cookie ~ "(^|; *)__Host-octoport_harness_return=1(;|$)") {
        return 303 /harness/;
    }
    proxy_pass http://127.0.0.1:18100;
    include /etc/nginx/snippets/octoport-visual-html*.conf;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}
