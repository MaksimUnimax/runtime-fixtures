server {
  listen 18443 ssl;
  server_name alisa.octoport.ru;
  ssl_certificate /etc/letsencrypt/live/alisa-platform-bootstrap/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/alisa-platform-bootstrap/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 5m;
  access_log off;
  add_header Referrer-Policy no-referrer always;
  add_header X-Content-Type-Options nosniff always;
  location = /lab-login {
    proxy_hide_header Referrer-Policy;
    add_header Referrer-Policy same-origin always;
    proxy_pass http://127.0.0.1:18444;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 10s;
    proxy_buffering off;
  }
  location @lab_login_redirect {
    return 302 /lab-login;
  }
  # Private operator-lab cost API: the native Host must authorize the cookie.
  location = /__lab_meter_auth {
    internal;
    proxy_pass http://127.0.0.1:18440/;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $http_host;
    proxy_set_header Cookie $http_cookie;
  }
  location = /lab-meter {
    auth_request /__lab_meter_auth;
    proxy_pass http://127.0.0.1:18442/lab-meter;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1;
    add_header Cache-Control "no-store, private" always;
  }
  location = /lab-meter-ui.js {
    alias /opt/harness-native-lab/releases/harness-native-20261120-r3/ui/lab-meter-ui.js;
    default_type application/javascript;
    add_header Cache-Control "no-cache, private";
  }
  location / {
    proxy_set_header Accept-Encoding "";
    sub_filter_once on;
    sub_filter '</body>' '<script src="/lab-meter-ui.js" defer></script></body>';
    proxy_intercept_errors on;
    error_page 401 = @lab_login_redirect;
    proxy_pass http://127.0.0.1:18440;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 240s;
    proxy_send_timeout 240s;
    proxy_buffering off;
    proxy_cookie_flags ~ secure httponly samesite=lax;
  }
}
