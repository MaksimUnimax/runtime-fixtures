name: Coordination and release safety
on:
  push:
    branches: [main, "work/c-integration", "controller/**"]
  pull_request:
    paths: ["tooling/coordination/**", "tooling/b1/**", "docs/development/coordination/**", ".github/workflows/coordination.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
      - run: python3 -m unittest discover -s tooling/coordination -p 'test_*.py'
      - name: Bounded process lifecycle and concurrent admission
        run: sudo env OCTOPORT_TEST_SYSTEMD=1 python3 tooling/coordination/test_resource_runner.py
      - run: node --test tooling/b1/release-safety.test.mjs
      - run: node --test tests/regression/extension-core/client-i1/browser-proof.test.mjs
