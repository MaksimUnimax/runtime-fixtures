name: Alisa platform source checks
on:
  pull_request:
    paths: ['products/alisa/**', 'docs/alisa/runtime/v0.11/rt_check_r01/**', 'docs/alisa/runtime/v0.11/rt_job_r02/**', 'docs/alisa/runtime/v0.11/question_catalog_r1/**', 'docs/alisa/quality/scripts/*question_catalog*', '.github/workflows/alisa-platform-ci.yml']
  push:
    branches: ['feat/alisa-platform-foundation-v05', 'feat/alisa-site-funnel-v05']
    paths: ['products/alisa/**', 'docs/alisa/runtime/v0.11/rt_check_r01/**', 'docs/alisa/runtime/v0.11/rt_job_r02/**', 'docs/alisa/runtime/v0.11/question_catalog_r1/**', 'docs/alisa/quality/scripts/*question_catalog*', '.github/workflows/alisa-platform-ci.yml']
permissions:
  contents: read
jobs:
  source:
    needs: r15-catalog-parameters
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ALISA_TEST_DB_ALLOW: '1'
      # Disposable fixture credentials; no live secrets are available to this job.
      ALISA_TEST_PG_DSN: postgresql://alisa_ci_admin:synthetic-alisa-ci-only@127.0.0.1:55480/alisa_ci_admin
    services:
      postgres:
        # Match the target's admitted Ubuntu PostgreSQL 16.15 runtime.
        image: postgres:16.15
        env:
          POSTGRES_USER: alisa_ci_admin
          POSTGRES_DB: alisa_ci_admin
          POSTGRES_PASSWORD: synthetic-alisa-ci-only
        ports:
          - 55480:5432
        options: >-
          --health-cmd "pg_isready -U alisa_ci_admin -d alisa_ci_admin"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record exact checked out source
        run: echo "ALISA_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Read exact current-run R15 source qualification
        uses: actions/download-artifact@v4
        with:
          pattern: s13-r15-qualification-*-${{ github.event.pull_request.head.sha || github.sha }}
          path: .s13-r15-evidence
          merge-multiple: true
      - name: Read pinned R15 source context for catalog compatibility
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: cafb743c94672104d4afa2c471398e5c81d904f5
          path: .s13-r15-context
          sparse-checkout: |
            docs/alisa/runtime/v0.11
            products/alisa/tests/current_parameters
            products/alisa/services/platform/src/alisa_platform/owner_data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Bounded store-check HTTPS and Unix protocol, no live provider
        working-directory: docs/alisa/runtime/v0.11/rt_check_r01
        run: |
          python qualify.py --output "$GITHUB_WORKSPACE/products/alisa/dist/rt-check-qualification.json"
          python qualify_baseline.py --output "$GITHUB_WORKSPACE/products/alisa/dist/rt-check-baseline-qualification.json"
          python build_package.py --source "$ALISA_SOURCE_SHA" --output "$GITHUB_WORKSPACE/products/alisa/dist"
      - name: Locked toolchain dependencies before runtime extensions
        working-directory: products/alisa
        run: ./bin/alisa bootstrap --locked
      - name: Catalog release contracts on disposable PostgreSQL and pinned R15
        working-directory: products/alisa
        run: |
          .venv/bin/python -B tests/integration/qualify_runtime_authority.py \
            --output dist/s13-catalog-qualification.json \
            --current-core-source "$GITHUB_WORKSPACE/docs/alisa/runtime/v0.11/rt_job_r02" \
            --platform-stores-overlay --template-clarification-overlay --question-catalog-overlay \
            --catalog-release-overlay --catalog-release-only \
            --catalog-r15-context "$GITHUB_WORKSPACE/.s13-r15-context" \
            --catalog-r15-evidence "$GITHUB_WORKSPACE/.s13-r15-evidence"
      - name: Explicit voice coefficient consent and shared writer on isolated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          name="alisa-voice-coeff-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          root="/dev/shm/alisa-current-parameters-pg-voice-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$root"
          ! docker inspect "$name" >/dev/null 2>&1
          mkdir -m 700 "$root"
          cleanup() {
            set +e
            label=$(docker inspect -f '{{index .Config.Labels "alisa.task"}}' "$name" 2>/dev/null)
            if [ "$label" = "$name" ]; then docker stop -t 3 "$name" >/dev/null; docker rm "$name" >/dev/null; fi
            rmdir "$root" 2>/dev/null
          }
          trap cleanup EXIT TERM INT
          docker run -d --name "$name" --label "alisa.task=$name" --network none \
            --memory 384m --memory-swap 384m --cpus 1 --pids-limit 128 \
            --tmpfs /var/lib/postgresql/data:rw,size=192m -v "$root:/var/run/postgresql" \
            -e POSTGRES_DB=parameter_test -e POSTGRES_HOST_AUTH_METHOD=trust postgres:16.15
          ready=0
          for attempt in $(seq 1 30); do
            if docker exec "$name" pg_isready -U postgres -d parameter_test; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          docker exec "$name" psql -U postgres -d parameter_test -v ON_ERROR_STOP=1 \
            -c 'CREATE ROLE test_parameter_test_runtime NOLOGIN; CREATE ROLE parameter_test_runtime NOLOGIN;'
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 PARAMETER_TEST_SOCKET="$root" \
            "$GITHUB_WORKSPACE/products/alisa/.venv/bin/python" -I -B \
            products/alisa/tests/current_parameters/qualify_voice.py \
            --output products/alisa/dist/voice-parameter-qualification.json
          cleanup
          ! docker inspect "$name" >/dev/null 2>&1
          test ! -e "$root"
          trap - EXIT TERM INT
      - name: Read-only question catalogue and selected-store draft
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/products/alisa/services/platform/src:$GITHUB_WORKSPACE/docs/alisa/runtime/v0.11/question_catalog_r1:$GITHUB_WORKSPACE/products/alisa/tests/question_catalog:$GITHUB_WORKSPACE/docs/alisa/runtime/v0.11/rt_job_r02:$GITHUB_WORKSPACE/docs/alisa/runtime/v0.11/rt_job_r02/tests"
          products/alisa/.venv/bin/python -B -m unittest test_catalog -q
          node products/alisa/tests/question_catalog/test_draft.mjs
      - name: Legacy Station rollout and rollback boundaries on disposable files
        run: python -B -m unittest discover -s docs/alisa/quality/scripts -p test_install_legacy_voice_clarification_20261114.py -q
      - name: Catalog rollout failure and rollback boundaries on disposable files
        run: python -B -m unittest discover -s docs/alisa/quality/scripts -p test_install_question_catalog_20261114.py -q
      - name: Current runtime fairness, deadlines and offline regression
        working-directory: products/alisa/runtime
        run: |
          ../.venv/bin/python run_checks.py --output ../dist/runtime-qualification.json
          ../.venv/bin/python build_package.py --source "$ALISA_SOURCE_SHA" --output ../dist
      - name: Locked source checks and UI build (not stage acceptance)
        # The S07 port carries the frozen current core, its full original
        # regression and new guard/consumer/reader tests in a separate source.
        working-directory: products/alisa
        run: |
          ./bin/alisa test --scope foundation
          ./bin/alisa build
          ./bin/alisa package --source "$ALISA_SOURCE_SHA"
      - name: Compatible runtime versions through real systemd startup
        working-directory: products/alisa
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT .venv/bin/python \
            tests/runtime_versions/qualify_startup.py --disposable-github-runner \
            --output dist/runtime-version-sync-qualification.json
      - name: Install a disposable Chromium test browser
        working-directory: products/alisa
        run: |
          .venv/bin/python -m playwright install --with-deps chromium
          sudo apt-get install --no-install-recommends -y libnss3-tools
      - name: Question catalogue in real Next and isolated browser fixture
        working-directory: products/alisa
        run: .venv/bin/python -B tests/question_catalog/qualify_browser.py
      - name: Native staff MFA and command policies on isolated PostgreSQL
        working-directory: products/alisa
        run: |
          .venv/bin/python tests/integration/qualify_staff_core.py --output dist/s03-core-qualification.json
      - name: Access ledger, replay and partial bulk on isolated PostgreSQL
        working-directory: products/alisa
        run: |
          .venv/bin/python tests/integration/qualify_access_core.py --output dist/s04-core-qualification.json
      - name: Store vault, tenant isolation and Unix setup-check on isolated PostgreSQL
        working-directory: products/alisa
        run: |
          .venv/bin/python tests/integration/qualify_stores_core.py --output dist/s05-core-qualification.json
      - name: Alice OAuth consent, replay, refresh and unlink on isolated PostgreSQL
        working-directory: products/alisa
        run: |
          .venv/bin/python tests/integration/qualify_skill_core.py --output dist/s06-core-qualification.json
      - name: Runtime authority, current access and signed tickets on isolated PostgreSQL
        working-directory: products/alisa
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="${PLAYWRIGHT_BROWSERS_PATH:-$HOME/.cache/ms-playwright}"
          sudo --preserve-env=ALISA_TEST_DB_ALLOW,ALISA_TEST_PG_DSN,GITHUB_ACTIONS,PATH,PLAYWRIGHT_BROWSERS_PATH \
            .venv/bin/python tests/integration/qualify_runtime_authority.py \
            --output dist/s07-authority-qualification.json \
            --current-core-source "$GITHUB_WORKSPACE/docs/alisa/runtime/v0.11/rt_job_r02" \
            --platform-stores-overlay --template-clarification-overlay --question-catalog-overlay \
            --report-browser-artifact "dist/alisa-${ALISA_SOURCE_SHA:0:16}.tar.gz"
      - name: Current-core RuntimePort, reader isolation and seven-day model accounting
        working-directory: docs/alisa/runtime/v0.11/rt_job_r02
        run: |
          "$GITHUB_WORKSPACE/products/alisa/.venv/bin/python" run_checks.py --output "$GITHUB_WORKSPACE/products/alisa/dist/s07-current-core-qualification.json"
      - name: Real PostgreSQL and packaged browser qualification (not stage acceptance)
        working-directory: products/alisa
        run: |
          .venv/bin/python tests/integration/run_postgres.py \
            --artifact "dist/alisa-${ALISA_SOURCE_SHA:0:16}.tar.gz" --browser \
            --output dist/postgresql-browser-qualification.json
      - name: Real identity BFF and cabinet on isolated PostgreSQL and verified HTTPS
        working-directory: products/alisa
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="${PLAYWRIGHT_BROWSERS_PATH:-$HOME/.cache/ms-playwright}"
          sudo --preserve-env=ALISA_TEST_DB_ALLOW,ALISA_TEST_PG_DSN,GITHUB_ACTIONS,PATH,PLAYWRIGHT_BROWSERS_PATH \
            .venv/bin/python tests/integration/qualify_identity.py \
            --artifact "dist/alisa-${ALISA_SOURCE_SHA:0:16}.tar.gz" \
            --output dist/s02-qualification.json --staff --access --stores --alice
      - name: Open email registration and repeat login without an invitation list
        working-directory: products/alisa
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="${PLAYWRIGHT_BROWSERS_PATH:-$HOME/.cache/ms-playwright}"
          sudo --preserve-env=ALISA_TEST_DB_ALLOW,ALISA_TEST_PG_DSN,GITHUB_ACTIONS,PATH,PLAYWRIGHT_BROWSERS_PATH \
            .venv/bin/python tests/integration/qualify_identity.py \
            --artifact "dist/alisa-${ALISA_SOURCE_SHA:0:16}.tar.gz" \
            --output dist/s02-open-registration-qualification.json --open-registration
      - name: Save safe qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alisa-foundation-qualification-${{ env.ALISA_SOURCE_SHA }}
          path: |
            products/alisa/dist/postgresql-browser-qualification.json
            products/alisa/dist/s01-home-*.png
            products/alisa/dist/s02-*.json
            products/alisa/dist/s02-empty-state.png
            products/alisa/dist/s03-*.json
            products/alisa/dist/s04-*.json
            products/alisa/dist/s05-*.json
            products/alisa/dist/s06-*.json
            products/alisa/dist/voice-parameter-qualification.json
            products/alisa/dist/s07-*.json
            products/alisa/dist/s13-*.json
            products/alisa/dist/rt-check-*.json
            products/alisa/dist/runtime-qualification.json
            products/alisa/dist/runtime-version-sync-qualification.json
            products/alisa/dist/s02-identity-*.png
          if-no-files-found: error
      - name: Save the qualified immutable stage package
        uses: actions/upload-artifact@v4
        with:
          name: alisa-platform-package-${{ env.ALISA_SOURCE_SHA }}
          path: |
            products/alisa/dist/alisa-*.tar.gz
            products/alisa/dist/alisa-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Save qualified runtime-side store-check source package
        uses: actions/upload-artifact@v4
        with:
          name: alisa-runtime-store-check-${{ env.ALISA_SOURCE_SHA }}
          path: |
            products/alisa/dist/rt-check-*.tar.gz
            products/alisa/dist/rt-check-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  r15-catalog-parameters:
    name: R15 catalog context (${{ matrix.suite }} ${{ matrix.shard_index }}/${{ matrix.shard_count }})
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: base, shard_count: 1, shard_index: 0}
          - {suite: collection, shard_count: 1, shard_index: 0}
          - {suite: ledger, shard_count: 1, shard_index: 0}
          - {suite: compound, shard_count: 4, shard_index: 0}
          - {suite: compound, shard_count: 4, shard_index: 1}
          - {suite: compound, shard_count: 4, shard_index: 2}
          - {suite: compound, shard_count: 4, shard_index: 3}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Read pinned R15 test and platform sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: cafb743c94672104d4afa2c471398e5c81d904f5
          path: .s13-r15-context
          sparse-checkout: |
            docs/alisa/runtime/v0.11
            products/alisa/tests
            products/alisa/services/platform/src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Install locked Python test dependencies
        run: |
          python -m venv products/alisa/.venv
          products/alisa/.venv/bin/python -m pip install --require-hashes -r products/alisa/requirements-dev.lock
      - name: Compose the exact S13 plugin on the pinned R15 test core
        run: |
          native="/dev/shm/alisa-parameter-ci-s13-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.suite }}-${{ matrix.shard_index }}"
          echo "PARAMETER_TEST_RUNTIME_ROOT=$native" >> "$GITHUB_ENV"
          products/alisa/.venv/bin/python -B products/alisa/tests/catalog_release/r15_qualification.py prepare \
            --context "$GITHUB_WORKSPACE/.s13-r15-context" --core "$native" \
            --output "products/alisa/dist/s13-r15-${{ matrix.suite }}-${{ matrix.shard_index }}-prepared.json"
      - name: Existing R15 qualified suite on an owned Unix PostgreSQL
        timeout-minutes: 12
        run: |
          set -euo pipefail
          name="alisa-s13-r15-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.suite }}-${{ matrix.shard_index }}"
          root="/dev/shm/alisa-current-parameters-pg-ci-s13-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.suite }}-${{ matrix.shard_index }}"
          test ! -e "$root"
          mkdir -m 700 "$root"
          mkdir -m 700 "$root/socket"
          sudo chown 999:999 "$root/socket"
          export PARAMETER_TEST_SOCKET="$root/socket"
          export ALISA_TEST_NODE="$(command -v node)"
          cleanup() {
            label="$(docker inspect -f '{{ index .Config.Labels "alisa.task" }}' "$name" 2>/dev/null || true)"
            if [ "$label" = "$name" ]; then docker rm -f "$name" >/dev/null; fi
          }
          trap cleanup EXIT
          docker run -d --name "$name" --label "alisa.task=$name" --network none \
            --memory 384m --memory-swap 384m --cpus 1 --pids-limit 128 \
            --tmpfs /var/lib/postgresql/data:rw,size=192m \
            -v "$root/socket:/var/run/postgresql" \
            -e POSTGRES_DB=parameter_test -e POSTGRES_HOST_AUTH_METHOD=trust postgres:16.15
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec "$name" pg_isready -U postgres -d parameter_test; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          docker exec "$name" psql -U postgres -d parameter_test -v ON_ERROR_STOP=1 \
            -c 'CREATE ROLE test_parameter_test_runtime NOLOGIN; CREATE ROLE parameter_test_runtime NOLOGIN;'
          sudo --preserve-env=PARAMETER_TEST_SOCKET,PARAMETER_TEST_RUNTIME_ROOT,ALISA_TEST_NODE \
            products/alisa/.venv/bin/python -B \
            .s13-r15-context/products/alisa/tests/current_parameters/ci_qualified_suites.py \
            --suite '${{ matrix.suite }}' \
            --shard-count '${{ matrix.shard_count }}' --shard-index '${{ matrix.shard_index }}' \
            --output "$GITHUB_WORKSPACE/products/alisa/dist/s13-r15-${{ matrix.suite }}-${{ matrix.shard_index }}-suite.json"
      - name: Seal the actual executed suite and unchanged native source
        run: |
          products/alisa/.venv/bin/python -B products/alisa/tests/catalog_release/r15_qualification.py attest \
            --core "$PARAMETER_TEST_RUNTIME_ROOT" \
            --prepared "products/alisa/dist/s13-r15-${{ matrix.suite }}-${{ matrix.shard_index }}-prepared.json" \
            --report "products/alisa/dist/s13-r15-${{ matrix.suite }}-${{ matrix.shard_index }}-suite.json" \
            --output "products/alisa/dist/s13-r15-${{ matrix.suite }}-${{ matrix.shard_index }}-attestation.json"
      - name: Retain source qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s13-r15-qualification-${{ matrix.suite }}-${{ matrix.shard_index }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: products/alisa/dist/s13-r15-${{ matrix.suite }}-${{ matrix.shard_index }}-*.json
          if-no-files-found: error
      - name: Clean only this job's native and PostgreSQL fixtures
        if: always()
        run: |
          native="/dev/shm/alisa-parameter-ci-s13-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.suite }}-${{ matrix.shard_index }}"
          root="/dev/shm/alisa-current-parameters-pg-ci-s13-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.suite }}-${{ matrix.shard_index }}"
          sudo rm -rf -- "$native" "$root"
