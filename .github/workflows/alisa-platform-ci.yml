name: Alisa platform source checks
on:
  pull_request:
    paths: ['products/alisa/**', 'docs/alisa/runtime/v0.11/rt_check_r01/**', '.github/workflows/alisa-platform-ci.yml']
  push:
    branches: ['feat/alisa-platform-foundation-v05', 'feat/alisa-site-funnel-v05']
    paths: ['products/alisa/**', 'docs/alisa/runtime/v0.11/rt_check_r01/**', '.github/workflows/alisa-platform-ci.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ALISA_TEST_DB_ALLOW: '1'
      # Disposable fixture credentials; no live secrets are available to this job.
      ALISA_TEST_PG_DSN: postgresql://alisa_ci_admin:synthetic-alisa-ci-only@127.0.0.1:55480/alisa_ci_admin
    services:
      postgres:
        # Match the target's admitted Ubuntu PostgreSQL 16.15 runtime.
        image: postgres:16.15
        env:
          POSTGRES_USER: alisa_ci_admin
          POSTGRES_DB: alisa_ci_admin
          POSTGRES_PASSWORD: synthetic-alisa-ci-only
        ports:
          - 55480:5432
        options: >-
          --health-cmd "pg_isready -U alisa_ci_admin -d alisa_ci_admin"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record exact checked out source
        run: echo "ALISA_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Bounded store-check HTTPS and Unix protocol, no live provider
        working-directory: docs/alisa/runtime/v0.11/rt_check_r01
        run: |
          python qualify.py --output "$GITHUB_WORKSPACE/products/alisa/dist/rt-check-qualification.json"
          python qualify_baseline.py --output "$GITHUB_WORKSPACE/products/alisa/dist/rt-check-baseline-qualification.json"
          python build_package.py --source "$ALISA_SOURCE_SHA" --output "$GITHUB_WORKSPACE/products/alisa/dist"
      - name: Current runtime fairness, deadlines and offline regression
        working-directory: products/alisa/runtime
        run: |
          python run_checks.py --output ../dist/runtime-qualification.json
          python build_package.py --source "$ALISA_SOURCE_SHA" --output ../dist
      - name: Locked source checks and UI build (not stage acceptance)
        working-directory: products/alisa
        run: |
          ./bin/alisa bootstrap --locked
          ./bin/alisa test --scope foundation
          ./bin/alisa build
          ./bin/alisa package --source "$ALISA_SOURCE_SHA"
      - name: Install a disposable Chromium test browser
        working-directory: products/alisa
        run: |
          .venv/bin/python -m playwright install --with-deps chromium
          sudo apt-get install --no-install-recommends -y libnss3-tools
      - name: Native staff MFA and command policies on isolated PostgreSQL
        working-directory: products/alisa
        run: |
          .venv/bin/python tests/integration/qualify_staff_core.py --output dist/s03-core-qualification.json
      - name: Access ledger, replay and partial bulk on isolated PostgreSQL
        working-directory: products/alisa
        run: |
          .venv/bin/python tests/integration/qualify_access_core.py --output dist/s04-core-qualification.json
      - name: Store vault, tenant isolation and Unix setup-check on isolated PostgreSQL
        working-directory: products/alisa
        run: |
          .venv/bin/python tests/integration/qualify_stores_core.py --output dist/s05-core-qualification.json
      - name: Alice OAuth consent, replay, refresh and unlink on isolated PostgreSQL
        working-directory: products/alisa
        run: |
          .venv/bin/python tests/integration/qualify_skill_core.py --output dist/s06-core-qualification.json
      - name: Runtime authority, current access and signed tickets on isolated PostgreSQL
        working-directory: products/alisa
        run: |
          .venv/bin/python tests/integration/qualify_runtime_authority.py --output dist/s07-authority-qualification.json
      - name: Real PostgreSQL and packaged browser qualification (not stage acceptance)
        working-directory: products/alisa
        run: |
          .venv/bin/python tests/integration/run_postgres.py \
            --artifact "dist/alisa-${ALISA_SOURCE_SHA:0:16}.tar.gz" --browser \
            --output dist/postgresql-browser-qualification.json
      - name: Real identity BFF and cabinet on isolated PostgreSQL and verified HTTPS
        working-directory: products/alisa
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="${PLAYWRIGHT_BROWSERS_PATH:-$HOME/.cache/ms-playwright}"
          sudo --preserve-env=ALISA_TEST_DB_ALLOW,ALISA_TEST_PG_DSN,GITHUB_ACTIONS,PATH,PLAYWRIGHT_BROWSERS_PATH \
            .venv/bin/python tests/integration/qualify_identity.py \
            --artifact "dist/alisa-${ALISA_SOURCE_SHA:0:16}.tar.gz" \
            --output dist/s02-qualification.json --staff --access --stores --alice
      - name: Open email registration and repeat login without an invitation list
        working-directory: products/alisa
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="${PLAYWRIGHT_BROWSERS_PATH:-$HOME/.cache/ms-playwright}"
          sudo --preserve-env=ALISA_TEST_DB_ALLOW,ALISA_TEST_PG_DSN,GITHUB_ACTIONS,PATH,PLAYWRIGHT_BROWSERS_PATH \
            .venv/bin/python tests/integration/qualify_identity.py \
            --artifact "dist/alisa-${ALISA_SOURCE_SHA:0:16}.tar.gz" \
            --output dist/s02-open-registration-qualification.json --open-registration
      - name: Save safe qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alisa-foundation-qualification-${{ env.ALISA_SOURCE_SHA }}
          path: |
            products/alisa/dist/postgresql-browser-qualification.json
            products/alisa/dist/s01-home-*.png
            products/alisa/dist/s02-*.json
            products/alisa/dist/s02-empty-state.png
            products/alisa/dist/s03-*.json
            products/alisa/dist/s04-*.json
            products/alisa/dist/s05-*.json
            products/alisa/dist/s06-*.json
            products/alisa/dist/s07-*.json
            products/alisa/dist/rt-check-*.json
            products/alisa/dist/runtime-qualification.json
            products/alisa/dist/s02-identity-*.png
          if-no-files-found: error
      - name: Save the qualified immutable stage package
        uses: actions/upload-artifact@v4
        with:
          name: alisa-platform-package-${{ env.ALISA_SOURCE_SHA }}
          path: |
            products/alisa/dist/alisa-*.tar.gz
            products/alisa/dist/alisa-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Save qualified runtime-side store-check source package
        uses: actions/upload-artifact@v4
        with:
          name: alisa-runtime-store-check-${{ env.ALISA_SOURCE_SHA }}
          path: |
            products/alisa/dist/rt-check-*.tar.gz
            products/alisa/dist/rt-check-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
