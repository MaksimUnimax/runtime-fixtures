name: Site Deploy CI

on:
  pull_request:
    paths:
      - "apps/site/public/**"
      - "infra/production/nginx/octoport-site.conf"
      - "infra/production/scripts/deploy-octoport-site.sh"
      - "infra/production/scripts/verify-octoport-site.sh"
      - ".github/workflows/site-deploy-ci.yml"
  push:
    paths:
      - "apps/site/public/**"
      - "infra/production/nginx/octoport-site.conf"
      - "infra/production/scripts/deploy-octoport-site.sh"
      - "infra/production/scripts/verify-octoport-site.sh"
      - ".github/workflows/site-deploy-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-deploy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - name: Validate repository whitespace
        run: git diff --check HEAD^ HEAD

      - name: Validate shell syntax
        run: |
          bash -n infra/production/scripts/deploy-octoport-site.sh
          bash -n infra/production/scripts/verify-octoport-site.sh

      - name: Validate SITE-S1 deployment contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          nginx = Path("infra/production/nginx/octoport-site.conf").read_text(encoding="utf-8")
          deploy = Path("infra/production/scripts/deploy-octoport-site.sh").read_text(encoding="utf-8")
          verify = Path("infra/production/scripts/verify-octoport-site.sh").read_text(encoding="utf-8")

          expected_http_hosts = {"octoport.ru", "www.octoport.ru", "app.octoport.ru", "api.octoport.ru", "mail.octoport.ru"}
          for host in expected_http_hosts:
              assert host in nginx, f"nginx HTTP ingress missing {host}"
              assert host in verify, f"verifier missing {host}"

          server_names = re.findall(r"server_name\s+([^;]+);", nginx)
          flattened = {host for group in server_names for host in group.split()}
          assert "admin.octoport.ru" not in flattened, "admin.octoport.ru must not become an app vhost"

          assert "root /var/www/octoport-site/current;" in nginx
          assert "return 308 https://octoport.ru$request_uri;" in nginx
          assert "server_name app.octoport.ru;" not in nginx, "site ingress must not own app 443 vhost"
          assert "server_name api.octoport.ru;" not in nginx, "site ingress must not own API 443 vhost"
          assert "service_not_deployed" not in nginx
          assert 'return 503 "Octoport portal is not deployed yet.\\n";' not in nginx
          assert "Content-Security-Policy" in nginx and "default-src 'none'" in nginx
          assert "/etc/letsencrypt/live/octoport.ru/fullchain.pem" in nginx

          assert 'SITE_ROOT="/var/www/octoport-site"' in deploy
          assert 'RELEASE_DIR="${RELEASES_DIR}/${SOURCE_SHA}"' in deploy
          assert 'APPS_NGINX="${NGINX_CONF_DIR}/octoport-apps.conf"' in deploy
          assert "assert_existing_app_ingress" in deploy
          assert "proxy_pass http://127.0.0.1:3100;" in deploy
          assert "proxy_pass http://127.0.0.1:3000;" in deploy
          assert "backup_existing_state" in deploy
          assert "capture_failure_diagnostics" in deploy
          assert "restore_previous_state" in deploy
          assert "trap on_exit EXIT" in deploy
          assert "verify-octoport-site.sh" in deploy
          assert "rm -rf" not in deploy, "deploy must not destructively clean releases"
          assert "git reset" not in deploy and "git clean" not in deploy

          assert "docs.selleragents.ru" in verify, "legacy docs safety check is mandatory"
          assert "admin\\.octoport\\.ru" in verify, "admin-host safety check is mandatory"
          assert "certbot.timer" in verify
          assert "EXPECTED_SITE_SHA" in verify
          assert "check_redirects_and_existing_apps" in verify
          assert "https://app.octoport.ru/login" in verify
          assert "https://api.octoport.ru/health/live" in verify
          assert "https://api.octoport.ru/health/ready" in verify
          assert "grep -Fq 'Не отправляйте секреты'" in verify, "support secret-warning check must be locale-independent"
          assert "grep -Fq 'Редактирование цен, карточек товаров и ставок не поддерживается'" in verify, "support read-only check must be locale-independent"

          print("SITE-S1 DEPLOY CONTRACT PASS")
          PY
