name: Server CI

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/portal/**"
      - "apps/admin/**"
      - "apps/worker/**"
      - "apps/health-runner/**"
      - "apps/telegram-operator/**"
      - "tooling/api-watch/**"
      - "packages/server/**"
      - "packages/contracts/**"
      - "packages/shared/**"
      - "tests/integration/server/**"
      - "tests/e2e/server/**"
      - "tooling/server/**"
      - "tooling/operations/test_install_octoport_postgres_backup.py"
      - "tooling/operations/backup_postgres_independent.py"
      - "tooling/operations/test_backup_postgres_independent.py"
      - "tooling/operations/offsite_backup_policy.py"
      - "tooling/operations/test_offsite_backup_policy.py"
      - "tooling/checks/server-import-check.mjs"
      - "infra/local/**"
      - "infra/production/scripts/install-octoport-postgres-backup.sh"
      - "docs/server/**"
      - "docs/migration/evidence/SERVER_IMPORT_MANIFEST.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "eslint.config.mjs"
      - ".prettierignore"
      - ".github/workflows/server-ci.yml"
  push:
    branches:
      [
        main,
        "work/a-extension",
        "work/b-backend",
        "work/c-integration",
        "controller/**",
      ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: true

jobs:
  ci-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      full_tests: ${{ steps.proof.outputs.full_tests }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Resolve exact full-test proof or run all tests
        id: proof
        run: python3 tooling/coordination/ci_proof.py --workflow server-ci.yml --output "$RUNNER_TEMP/ci-proof.json"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Preserve test selection and original proof identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-proof-server-ci.yml-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-proof.json
          if-no-files-found: error
          retention-days: 14
  server:
    needs: ci-plan
    if: needs.ci-plan.outputs.full_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18.0
        env:
          # CI DEVELOPMENT/TEST ONLY: disposable, non-production credentials.
          POSTGRES_DB: product_control_plane_test
          POSTGRES_USER: product_control_plane_ci
          POSTGRES_PASSWORD: ci_development_only_password
        options: >-
          --health-cmd "pg_isready -U product_control_plane_ci -d product_control_plane_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Verify frozen server import
        if: startsWith(github.ref, 'refs/heads/migration/server-')
        run: node tooling/checks/server-import-check.mjs
      - run: pnpm install --frozen-lockfile
      - name: Verify PostgreSQL backup installer configuration parser
        run: python3 -m unittest discover -s tooling/operations -p 'test_install_octoport_postgres_backup.py' -v
      - name: Verify PostgreSQL backup retention and offsite policy
        run: |
          python3 -B -m unittest discover -s tooling/operations -p 'test_backup_postgres_independent.py' -v
          python3 -B -m unittest discover -s tooling/operations -p 'test_offsite_backup_policy.py' -v
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm exec vitest run tests/e2e/server/playwright-config-regression.test.ts
      - run: pnpm exec playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/product-control-plane-playwright
      - run: pnpm test
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/product-control-plane-playwright
      - name: Prepare isolated R3 migration boundary
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U product_control_plane_ci operator_r3_trees
          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path
          source = Path("packages/server/db/drizzle")
          target = Path(os.environ["RUNNER_TEMP"]) / "octoport-r3-baseline-0058"
          journal = json.loads((source / "meta/_journal.json").read_text())
          boundary = next(i for i, entry in enumerate(journal["entries"]) if entry["tag"] == "0059_ai_prompt_trees")
          assert boundary == 47
          prefix = {**journal, "entries": journal["entries"][:boundary]}
          (target / "meta").mkdir(parents=True, exist_ok=False)
          (target / "meta/_journal.json").write_text(json.dumps(prefix))
          for entry in prefix["entries"]:
              shutil.copyfile(source / (entry["tag"] + ".sql"), target / (entry["tag"] + ".sql"))
          PY
      - name: Record exact integration sources
        run: |
          mkdir -p "$RUNNER_TEMP/server-integration-evidence"
          python3 - <<'PYINPUT'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path.cwd()
          output = Path(os.environ["RUNNER_TEMP"]) / "server-integration-evidence"
          git = lambda *args: subprocess.check_output(["git", *args], text=True).strip()
          head = git("rev-parse", "HEAD")
          assert head == os.environ["GITHUB_SHA"], "INTEGRATION_CHECKOUT_SHA_MISMATCH"
          tracked = set(git("ls-files", "tests/integration/server", "packages/server/db/src").splitlines())
          files = set(tracked)
          for directory in ("tests/integration/server", "packages/server/db/src"):
              files.update(str(p.relative_to(root)) for p in (root / directory).rglob("*.ts") if "node_modules" not in p.parts)
          records = []
          for name in sorted(files):
              p = root / name
              if not p.is_file() or p.is_symlink():
                  continue
              records.append({"path": name, "tracked": name in tracked, "sha256": hashlib.sha256(p.read_bytes()).hexdigest()})
          manifest = {"head": head, "tree": git("rev-parse", "HEAD^{tree}"), "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"], "worktree_status": git("status", "--porcelain", "--", "tests/integration/server", "packages/server/db/src"), "files": records}
          (output / "source-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PYINPUT
      - name: Run complete integration suite
        run: pnpm test:integration --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/server-integration-evidence/vitest-results.json"
        env:
          DATABASE_URL: postgres://product_control_plane_ci:ci_development_only_password@127.0.0.1:5432/product_control_plane_test
          R3_TREE_DATABASE_URL: postgres://product_control_plane_ci:ci_development_only_password@127.0.0.1:5432/operator_r3_trees
          R3_TREE_BASELINE_MIGRATIONS: ${{ runner.temp }}/octoport-r3-baseline-0058
      - name: Preserve exact integration inputs and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: server-integration-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/server-integration-evidence
          if-no-files-found: warn
          retention-days: 14
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://product_control_plane_ci:ci_development_only_password@127.0.0.1:5432/product_control_plane_test
      - run: pnpm openapi:check
      - run: pnpm bridge:guard
      - run: pnpm build
      - run: pnpm test:e2e
        env:
          PRODUCT_CONTROL_PLANE_E2E: "1"
          DATABASE_URL: postgres://product_control_plane_ci:ci_development_only_password@127.0.0.1:5432/product_control_plane_test
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/product-control-plane-playwright
