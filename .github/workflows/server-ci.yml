name: Server CI

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/portal/**"
      - "apps/admin/**"
      - "apps/worker/**"
      - "apps/health-runner/**"
      - "apps/telegram-operator/**"
      - "tooling/api-watch/**"
      - "packages/server/**"
      - "packages/contracts/**"
      - "packages/shared/**"
      - "tests/integration/server/**"
      - "tests/e2e/server/**"
      - "tooling/server/**"
      - "tooling/checks/server-import-check.mjs"
      - "infra/local/**"
      - "docs/server/**"
      - "docs/migration/evidence/SERVER_IMPORT_MANIFEST.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "eslint.config.mjs"
      - ".prettierignore"
      - ".github/workflows/server-ci.yml"
  push:
    branches: [main, "work/c-integration", "controller/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18.0
        env:
          # CI DEVELOPMENT/TEST ONLY: disposable, non-production credentials.
          POSTGRES_DB: product_control_plane_test
          POSTGRES_USER: product_control_plane_ci
          POSTGRES_PASSWORD: ci_development_only_password
        options: >-
          --health-cmd "pg_isready -U product_control_plane_ci -d product_control_plane_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Verify frozen server import
        if: startsWith(github.ref, 'refs/heads/migration/server-')
        run: node tooling/checks/server-import-check.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm exec vitest run tests/e2e/server/playwright-config-regression.test.ts
      - run: pnpm exec playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/product-control-plane-playwright
      - run: pnpm test
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/product-control-plane-playwright
      - run: pnpm test:integration
        env:
          DATABASE_URL: postgres://product_control_plane_ci:ci_development_only_password@127.0.0.1:5432/product_control_plane_test
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://product_control_plane_ci:ci_development_only_password@127.0.0.1:5432/product_control_plane_test
      - run: pnpm openapi:check
      - run: pnpm bridge:guard
      - run: pnpm build
      - run: pnpm test:e2e
        env:
          PRODUCT_CONTROL_PLANE_E2E: "1"
          DATABASE_URL: postgres://product_control_plane_ci:ci_development_only_password@127.0.0.1:5432/product_control_plane_test
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/product-control-plane-playwright
