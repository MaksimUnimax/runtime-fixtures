name: Extension CI

on:
  push:
    branches: [main, "work/c-integration", "controller/**"]
  paths:
      - 'apps/extension/**'
      - 'packages/bridge-core/**'
      - 'packages/marketplaces/**'
      - 'packages/ai-adapters/**'
      - 'packages/browser-platform/**'
      - 'packages/control-client/**'
      - 'packages/contracts/**'
      - 'migration/reference/wildberries-v0.3.0/**'
      - 'tests/regression/imported/**'
      - 'tests/regression/extension-core/**'
      - 'tests/fixtures/imported/**'
      - 'tooling/build/extension_baseline.py'
      - 'tooling/build/extension_composed.py'
      - 'tooling/checks/extension_core.py'
      - 'tooling/checks/extension_import.py'
      - 'tooling/checks/extension-test-requirements.txt'
      - 'docs/migration/evidence/extensions-2026-09-14/RUNTIME_FILE_MAP.json'
      - 'docs/migration/evidence/extensions-2026-09-14/RUNTIME_LOAD_GRAPH.json'
      - 'docs/migration/evidence/extensions-2026-09-14/TEST_AND_AUTHORITY_INPUTS.json'
      - 'docs/migration/evidence/extension-import-2026-09-14/IMPORT_MANIFEST.json'
      - '.github/workflows/extension-ci.yml'
  pull_request:
    paths:
      - 'apps/extension/**'
      - 'packages/bridge-core/**'
      - 'packages/marketplaces/**'
      - 'packages/ai-adapters/**'
      - 'packages/browser-platform/**'
      - 'packages/control-client/**'
      - 'packages/contracts/**'
      - 'migration/reference/wildberries-v0.3.0/**'
      - 'tests/regression/imported/**'
      - 'tests/regression/extension-core/**'
      - 'tests/fixtures/imported/**'
      - 'tooling/build/extension_baseline.py'
      - 'tooling/build/extension_composed.py'
      - 'tooling/checks/extension_core.py'
      - 'tooling/checks/extension_import.py'
      - 'tooling/checks/extension-test-requirements.txt'
      - 'docs/migration/evidence/extensions-2026-09-14/RUNTIME_FILE_MAP.json'
      - 'docs/migration/evidence/extensions-2026-09-14/RUNTIME_LOAD_GRAPH.json'
      - 'docs/migration/evidence/extensions-2026-09-14/TEST_AND_AUTHORITY_INPUTS.json'
      - 'docs/migration/evidence/extension-import-2026-09-14/IMPORT_MANIFEST.json'
      - '.github/workflows/extension-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Common core / source and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify actual common-core composition and extracted ZIP
        run: python tooling/checks/extension_core.py --output build/extension-ci/core
      - name: Preserve common-core evidence and development archive
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: extension-core-${{ github.sha }}
          path: build/extension-ci/core/
          if-no-files-found: error
          retention-days: 14
  baseline:
    name: Baseline / ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite: [ozon, wb-nodes, wb-browsers]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install frozen browser fixture tools
        if: matrix.suite == 'wb-browsers'
        run: python -m pip install -r tooling/checks/extension-test-requirements.txt
      - name: Select and record Chrome for fixtures
        if: matrix.suite == 'wb-browsers'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/extension-fixture-browsers
        run: |
          python - <<'PY'
          import os, shutil, subprocess, sys
          chrome = shutil.which('google-chrome') or shutil.which('google-chrome-stable')
          if chrome is None:
              subprocess.run([sys.executable, '-m', 'playwright', 'install', '--with-deps', 'chromium'], check=True)
              from playwright.sync_api import sync_playwright
              with sync_playwright() as pw:
                  chrome = pw.chromium.executable_path
          print(subprocess.check_output([chrome, '--version'], text=True).strip())
          with open(os.environ['GITHUB_ENV'], 'a') as file:
              file.write('WB_TEST_CHROMIUM=' + chrome + '\n')
          PY
      - name: Execute preserved source and extracted-package routes
        run: python tooling/checks/extension_import.py --suite ${{ matrix.suite }} --output build/extension-ci/${{ matrix.suite }}
      - name: Preserve evidence and baseline archives
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: extension-baseline-${{ matrix.suite }}-${{ github.sha }}
          path: build/extension-ci/${{ matrix.suite }}/
          if-no-files-found: error
          retention-days: 14

  application-browser:
    name: Common application / native Chromium fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install fixture browser
        run: |
          python -m pip install -r tooling/checks/extension-test-requirements.txt
          python -m playwright install --with-deps chromium
      - name: Build and verify actual popup, worker, content and attachments
        run: |
          node tests/regression/extension-core/client-i1/make-browser-config.mjs "$RUNNER_TEMP/seller-agents-browser-fixture-private.der" > "$RUNNER_TEMP/seller-agents-browser-fixture-config.json"
          export SA_PACKAGED_CONFIG_JSON="$(cat "$RUNNER_TEMP/seller-agents-browser-fixture-config.json")"
          python tooling/build/extension_composed.py --output build/application-browser/package
          python tests/regression/extension-core/browser_application.py --runtime build/application-browser/package/runtime --output build/application-browser/source --fixture-private-key "$RUNNER_TEMP/seller-agents-browser-fixture-private.der"
          python tests/regression/extension-core/browser_application.py --runtime build/application-browser/package/extracted --output build/application-browser/extracted --fixture-private-key "$RUNNER_TEMP/seller-agents-browser-fixture-private.der"
      - name: Preserve application fixture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: extension-application-browser-${{ github.sha }}
          path: build/application-browser/
          if-no-files-found: error
          retention-days: 14
