name: Extension I1-C1 client

on:
  push:
    branches:
      [
        main,
        "work/a-extension",
        "work/b-backend",
        "work/c-integration",
        "controller/**",
      ]
  pull_request:
    branches: [main]
    paths:
      - "apps/extension/**"
      - "packages/control-client/**"
      - "packages/bridge-core/src/{stores,execution,work}/**"
      - "tooling/build/extension_composed.py"
      - "tooling/checks/extension_i1.py"
      - "tests/regression/extension-core/**"
      - ".github/workflows/extension-i1-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: true

jobs:
  ci-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      full_tests: ${{ steps.proof.outputs.full_tests }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Resolve exact full-test proof or run all tests
        id: proof
        run: python3 tooling/coordination/ci_proof.py --workflow extension-i1-ci.yml --output "$RUNNER_TEMP/ci-proof.json"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Preserve test selection and original proof identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-proof-extension-i1-ci.yml-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-proof.json
          if-no-files-found: error
          retention-days: 14
  client-i1:
    needs: ci-plan
    if: needs.ci-plan.outputs.full_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r tooling/checks/extension-test-requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tooling/checks/extension_i1.py --output build/ci-extension-i1
        env:
          SA_NODE_BIN: node
      - run: python tests/regression/extension-core/client-i1/browser_verifier.py --runtime build/ci-extension-i1/package/runtime --output build/ci-extension-i1/browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-i1-${{ github.sha }}
          path: build/ci-extension-i1

  installed-local-integration:
    needs: ci-plan
    if: needs.ci-plan.outputs.full_tests == 'true'
    name: Installed local API / portal / PostgreSQL acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.0
        env:
          POSTGRES_USER: product_control_plane_ci
          POSTGRES_PASSWORD: ci_development_only_password
          POSTGRES_DB: seller_agents_i1_client
        ports:
          - 45432:5432
        options: >-
          --health-cmd "pg_isready -U product_control_plane_ci -d seller_agents_i1_client"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r tooling/checks/extension-test-requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/regression/extension-core/client-i1/installed_local_integration.py --output build/ci-installed-local
        env:
          PRODUCT_CONTROL_PLANE_E2E: "1"
          DATABASE_URL: postgres://product_control_plane_ci:ci_development_only_password@127.0.0.1:45432/seller_agents_i1_client
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-installed-local-${{ github.sha }}
          path: build/ci-installed-local
